###############################################################################
# Ansible Dynamic Inventory — AWS EC2 Plugin
# File: ansible/inventory/aws_ec2.yml
#
# Requirements:
#   pip install boto3 botocore
#   ansible-galaxy collection install 'amazon.aws:==8.2.1'
#
# NOTE: No inline comments on value lines — Ansible YAML parser is strict.
###############################################################################

plugin: amazon.aws.aws_ec2

# Region must match var.aws_region used in Terraform
# Check your region: aws configure get region
regions:
  - us-east-1

# Only discover instances we created (matched by tags)
filters:
  tag:Project: "devtools-lab"
  tag:AnsibleRole: "devtools"
  instance-state-name: "running"

# Auto-create Ansible groups from EC2 tags
keyed_groups:
  - key: tags.AnsibleRole
    prefix: role
    separator: "_"
  - key: tags.Environment
    prefix: env
    separator: "_"
  - key: tags.Project
    prefix: project
    separator: "_"

# Use public IP as the Ansible connection hostname
hostnames:
  - ip-address
  - dns-name

compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'./devtools-lab-key.pem'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no -o ConnectTimeout=30'"

# Cache API responses for 5 minutes to avoid repeated AWS calls
cache: true
cache_plugin: jsonfile
cache_connection: /tmp/aws_ec2_inventory_cache
cache_timeout: 300