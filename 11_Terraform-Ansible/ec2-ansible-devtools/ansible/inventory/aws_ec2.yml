###############################################################################
# Ansible Dynamic Inventory — AWS EC2 Plugin
# File: ansible/inventory/aws_ec2.yml
#
# Requirements:
#   pip install boto3 botocore
#   ansible-galaxy collection install amazon.aws
###############################################################################

plugin: amazon.aws.aws_ec2

# ─── AWS Connection ──────────────────────────────────────────────────────────
# Region(s) to query — match your Terraform region
regions:
  - ap-southeast-2        # ← Change to match var.aws_region in Terraform

# Use AWS credentials from environment variables / ~/.aws/credentials
# No hardcoded credentials here (best practice)

# ─── Filter: Only target instances we created ────────────────────────────────
filters:
  tag:Project: "devtools-lab"       # Must match var.project_name in Terraform
  tag:AnsibleRole: "devtools"
  instance-state-name: "running"

# ─── Grouping ────────────────────────────────────────────────────────────────
# Creates Ansible groups from instance tags automatically
keyed_groups:
  - key: tags.AnsibleRole
    prefix: role
    separator: "_"
  - key: tags.Environment
    prefix: env
    separator: "_"
  - key: tags.Project
    prefix: project
    separator: "_"

# ─── Host Variables ──────────────────────────────────────────────────────────
# Expose extra EC2 metadata as Ansible host vars
hostnames:
  - ip-address               # Use public IP as the hostname Ansible connects to
  - dns-name                 # Fallback: public DNS

compose:
  # Tell Ansible to connect via public IP
  ansible_host: public_ip_address

  # SSH connection settings
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'./devtools-lab-key.pem'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no -o ConnectTimeout=30'"

# ─── Include extra metadata ──────────────────────────────────────────────────
include_extra_api_calls: true

# ─── Cache settings (avoid repeated API calls) ───────────────────────────────
cache: true
cache_plugin: jsonfile
cache_connection: /tmp/aws_ec2_inventory_cache
cache_timeout: 300          # 5 minutes
