###############################################################################
# Group Variables — All Hosts
# File: ansible/group_vars/all.yml
###############################################################################

# ─── Package Versions ────────────────────────────────────────────────────────
kubectl_version: "v1.30.2"
kind_version:    "v0.23.0"

# ─── Architecture ────────────────────────────────────────────────────────────
arch: "amd64"

# ─── Docker ──────────────────────────────────────────────────────────────────
docker_users:
  - ubuntu                  # Users added to the docker group

# ─── Kind ────────────────────────────────────────────────────────────────────
kind_install_dir: "/usr/local/bin"
kind_binary_url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-{{ arch }}"

# ─── kubectl ─────────────────────────────────────────────────────────────────
kubectl_install_dir: "/usr/local/bin"
kubectl_binary_url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ arch }}/kubectl"

# ─── APT packages ────────────────────────────────────────────────────────────
apt_packages:
  - curl
  - unzip
  - tmux
  - git
  - wget
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https
  - software-properties-common
  - python3
  - python3-pip
