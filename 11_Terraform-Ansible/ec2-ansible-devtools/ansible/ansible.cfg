###############################################################################
# Ansible Configuration
# File: ansible/ansible.cfg
###############################################################################

[defaults]
# ─── Inventory ───────────────────────────────────────────────────────────────
inventory             = ./inventory/aws_ec2.yml   # Dynamic inventory (primary)
host_key_checking     = False                      # Skip SSH host key prompt
remote_user           = ubuntu                     # Ubuntu default user
private_key_file      = ./devtools-lab-key.pem    # Generated by Terraform

# ─── Output ──────────────────────────────────────────────────────────────────
stdout_callback       = yaml                       # Readable task output
callbacks_enabled     = timer, profile_tasks       # Show task timings

# ─── Performance ─────────────────────────────────────────────────────────────
forks                 = 10                         # Parallel connections
gathering             = smart                      # Cache facts
fact_caching          = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout  = 3600

# ─── Retry / Timeouts ────────────────────────────────────────────────────────
timeout               = 60
retry_files_enabled   = False

# ─── Logging ─────────────────────────────────────────────────────────────────
log_path              = ./ansible.log

[ssh_connection]
# Pipelining — reduces SSH overhead significantly
pipelining            = True
ssh_args              = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

[privilege_escalation]
become                = True
become_method         = sudo
become_user           = root
become_ask_pass       = False
