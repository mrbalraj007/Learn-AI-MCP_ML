###############################################################################
# Ansible Configuration
# File: ansible/ansible.cfg
#
# NOTE: Ansible does NOT support inline comments on value lines.
#       All comments must be on their own dedicated lines.
###############################################################################

[defaults]

# Dynamic inventory via aws_ec2 plugin
inventory               = ./inventory/aws_ec2.yml
host_key_checking       = False
remote_user             = ubuntu
# Private key auto-generated by Terraform
private_key_file        = ./devtools-lab-key.pem

# Readable YAML-style task output
stdout_callback         = yaml
callbacks_enabled       = timer, profile_tasks

# Number of parallel connections
forks                   = 10
# Cache facts to avoid re-gathering on every run
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout    = 3600

timeout                 = 60
retry_files_enabled     = False

log_path                = ./ansible.log

[ssh_connection]
# Pipelining reduces SSH overhead significantly
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False
[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, yaml, ini, auto
