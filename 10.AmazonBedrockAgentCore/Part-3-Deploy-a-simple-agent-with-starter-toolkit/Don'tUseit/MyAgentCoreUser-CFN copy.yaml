AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MyAgentCore IAM Stack v6
  - IAM User (MyAgentCoreUser) with 2 AWS managed + 1 customer managed policy
  - IAM Role (MyAgentCoreExecutionRole) with custom policy + trust policy
  - Access Key with outputs
  v6 Fix: Added xray:UpdateIndexingRule + full X-Ray indexing actions to both
          User managed policy and Execution Role.
          Note: The ValidationException on X-Ray Delivery Destination is a
          TIMING issue (destination is PENDING, not ACTIVE yet) — not a
          permissions issue. Re-run agentcore launch after 10-15 minutes.

# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:

  MyAgentCoreUserName:
    Description: IAM User name
    Value: !Ref MyAgentCoreUser

  MyAgentCoreUserArn:
    Description: IAM User ARN
    Value: !GetAtt MyAgentCoreUser.Arn

  MyAgentCoreAccessKeyId:
    Description: Access Key ID for MyAgentCoreUser
    Value: !Ref MyAgentCoreAccessKey

  MyAgentCoreSecretAccessKey:
    Description: Secret Access Key for MyAgentCoreUser (store securely)
    Value: !GetAtt MyAgentCoreAccessKey.SecretAccessKey

  MyAgentCoreExecutionRoleArn:
    Description: ARN of MyAgentCoreExecutionRole
    Value: !GetAtt MyAgentCoreExecutionRole.Arn

  MyAgentCoreExecutionRoleName:
    Description: Name of MyAgentCoreExecutionRole
    Value: !Ref MyAgentCoreExecutionRole

  MyAgentCoreUserPolicyArn:
    Description: ARN of the customer managed policy attached to MyAgentCoreUser
    Value: !Ref MyAgentCoreUserManagedPolicy

# =============================================================================
# RESOURCES
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # CUSTOMER MANAGED POLICY for MyAgentCoreUser
  # Using AWS::IAM::ManagedPolicy (6144 byte limit) instead of inline
  # policy (2048 byte limit) to accommodate all required permissions.
  # ---------------------------------------------------------------------------
  MyAgentCoreUserManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: MyAgentCoreUserPolicy-Customer
      Description: "Customer managed policy for MyAgentCoreUser covering Bedrock AgentCore, ECR, CodeBuild, IAM, S3, X-Ray, Application Signals, and CloudTrail permissions for agentcore launch and observability."
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Sid: BedrockAgentCoreAccess
            Effect: Allow
            Action:
              - bedrock-agentcore:*
              - bedrock:*
            Resource: '*'

          - Sid: ECRFullAccessForAgentBuilds
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:DescribeRepositories
              - ecr:CreateRepository
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:DescribeImages
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
              - ecr:DeleteRepository
              - ecr:ListImages
            Resource: '*'

          - Sid: CodeBuildAndLogsAccess
            Effect: Allow
            Action:
              - codebuild:CreateProject
              - codebuild:UpdateProject
              - codebuild:StartBuild
              - codebuild:BatchGetBuilds
              - codebuild:DeleteProject
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:GetLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: '*'

          - Sid: CloudWatchLogsDelivery
            Effect: Allow
            Action:
              - logs:CreateDeliveryDestination
              - logs:UpdateDeliveryDestination
              - logs:PutDeliveryDestination
              - logs:PutDeliveryDestinationPolicy
              - logs:PutDeliverySource
              - logs:CreateDeliverySource
              - logs:DeleteDeliverySource
              - logs:CreateDelivery
              - logs:GetDelivery
              - logs:GetDeliveryDestination
              - logs:GetDeliverySource
              - logs:DeleteDelivery
              - logs:DeleteDeliveryDestination
              - logs:DeleteDeliverySource
              - logs:DescribeDeliveries
              - logs:DescribeDeliveryDestinations
              - logs:DescribeDeliverySources
              - logs:PutResourcePolicy
              - logs:GetResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DeleteResourcePolicy
              - logs:CreateDestination
              - logs:PutDestination
              - logs:DeleteDestination
              - logs:DescribeDestinations
              - logs:PutDestinationPolicy
            Resource: '*'

          - Sid: IAMRoleManagement
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:CreateRole
              - iam:PassRole
              - iam:AttachRolePolicy
              - iam:PutRolePolicy
              - iam:CreateServiceLinkedRole
            Resource: '*'

          - Sid: S3AccessOptional
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:CreateBucket
              - s3:ListBucket
              - s3:PutLifecycleConfiguration
              - s3:GetLifecycleConfiguration
              - s3:DeleteBucket
            Resource: '*'

          # -----------------------------------------------------------------
          # v6 FIX: Expanded X-Ray permissions
          # xray:UpdateIndexingRule was missing — called after
          # UpdateTraceSegmentDestination succeeds to configure Transaction
          # Search indexing rules. Added full indexing rule CRUD + sampling.
          # -----------------------------------------------------------------
          - Sid: XRayFullAccess
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:UpdateTraceSegmentDestination
              - xray:GetTraceSegmentDestination
              - xray:UpdateIndexingRule
              - xray:GetIndexingRule
              - xray:ListIndexingRules
              - xray:GetSamplingRules
              - xray:UpdateSamplingRule
              - xray:CreateSamplingRule
              - xray:DeleteSamplingRule
              - xray:GetSamplingStatisticSummaries
              - xray:GetSamplingTargets
              - xray:GetServiceGraph
              - xray:GetTraceSummaries
              - xray:GetTrace
              - xray:BatchGetTraces
            Resource: '*'

          - Sid: ApplicationSignalsAccess
            Effect: Allow
            Action:
              - application-signals:StartDiscovery
              - application-signals:GetService
              - application-signals:ListServices
              - application-signals:GetServiceLevelObjective
              - application-signals:ListServiceLevelObjectives
              - application-signals:ListServiceDependencies
              - application-signals:ListServiceDependents
              - application-signals:ListServiceOperations
            Resource: '*'

          - Sid: CloudTrailServiceLinkedChannel
            Effect: Allow
            Action:
              - cloudtrail:CreateServiceLinkedChannel
              - cloudtrail:GetServiceLinkedChannel
              - cloudtrail:UpdateServiceLinkedChannel
              - cloudtrail:DeleteServiceLinkedChannel
              - cloudtrail:ListServiceLinkedChannels
            Resource: '*'

  # ---------------------------------------------------------------------------
  # IAM USER
  # ---------------------------------------------------------------------------
  MyAgentCoreUser:
    Type: AWS::IAM::User
    DependsOn: MyAgentCoreUserManagedPolicy
    Properties:
      UserName: MyAgentCoreUser
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - !Ref MyAgentCoreUserManagedPolicy
      Tags:
        - Key: Purpose
          Value: BedrockAgentCore
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # ACCESS KEY
  # ---------------------------------------------------------------------------
  MyAgentCoreAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref MyAgentCoreUser
      Status: Active

  # ---------------------------------------------------------------------------
  # IAM ROLE - MyAgentCoreExecutionRole
  # ---------------------------------------------------------------------------
  MyAgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MyAgentCoreExecutionRole
      Description: Execution role for Bedrock AgentCore runtime, CodeBuild, and ECS tasks
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
                - ecs-tasks.amazonaws.com
                - bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MyAgentCoreExecutionRoleCustomPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: BedrockModelAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                Resource: '*'

              - Sid: AgentCoreRuntime
                Effect: Allow
                Action:
                  - bedrock-agentcore:*
                Resource: '*'

              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource: '*'

              - Sid: CloudWatchLogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: 'arn:aws:logs:*:*:*'

              - Sid: CloudWatchLogsDelivery
                Effect: Allow
                Action:
                  - logs:CreateDeliveryDestination
                  - logs:UpdateDeliveryDestination
                  - logs:PutDeliveryDestination
                  - logs:PutDeliveryDestinationPolicy
                  - logs:PutDeliverySource
                  - logs:CreateDeliverySource
                  - logs:DeleteDeliverySource
                  - logs:CreateDelivery
                  - logs:GetDelivery
                  - logs:GetDeliveryDestination
                  - logs:GetDeliverySource
                  - logs:DeleteDelivery
                  - logs:DeleteDeliveryDestination
                  - logs:DeleteDeliverySource
                  - logs:DescribeDeliveries
                  - logs:DescribeDeliveryDestinations
                  - logs:DescribeDeliverySources
                  - logs:PutResourcePolicy
                  - logs:GetResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DeleteResourcePolicy
                  - logs:CreateDestination
                  - logs:PutDestination
                  - logs:DeleteDestination
                  - logs:DescribeDestinations
                  - logs:PutDestinationPolicy
                Resource: '*'

              - Sid: CloudWatchObservability
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'

              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: 'arn:aws:s3:::*'

              - Sid: CodeBuildAccess
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:BatchGetProjects
                  - codebuild:CreateProject
                  - codebuild:DeleteProject
                  - codebuild:UpdateProject
                Resource: '*'

              - Sid: IAMPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'

              - Sid: STSAccess
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - sts:AssumeRole
                Resource: '*'

              # ---------------------------------------------------------------
              # v6 FIX: Full X-Ray permissions on Role including indexing rules
              # ---------------------------------------------------------------
              - Sid: XRayFullAccess
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:UpdateTraceSegmentDestination
                  - xray:GetTraceSegmentDestination
                  - xray:UpdateIndexingRule
                  - xray:GetIndexingRule
                  - xray:ListIndexingRules
                  - xray:GetSamplingRules
                  - xray:UpdateSamplingRule
                  - xray:CreateSamplingRule
                  - xray:DeleteSamplingRule
                  - xray:GetSamplingStatisticSummaries
                  - xray:GetSamplingTargets
                  - xray:GetServiceGraph
                  - xray:GetTraceSummaries
                  - xray:GetTrace
                  - xray:BatchGetTraces
                Resource: '*'

              - Sid: ApplicationSignalsAccess
                Effect: Allow
                Action:
                  - application-signals:StartDiscovery
                  - application-signals:GetService
                  - application-signals:ListServices
                  - application-signals:GetServiceLevelObjective
                  - application-signals:ListServiceLevelObjectives
                  - application-signals:ListServiceDependencies
                  - application-signals:ListServiceDependents
                  - application-signals:ListServiceOperations
                Resource: '*'

              - Sid: CloudTrailServiceLinkedChannel
                Effect: Allow
                Action:
                  - cloudtrail:CreateServiceLinkedChannel
                  - cloudtrail:GetServiceLinkedChannel
                  - cloudtrail:UpdateServiceLinkedChannel
                  - cloudtrail:DeleteServiceLinkedChannel
                  - cloudtrail:ListServiceLinkedChannels
                Resource: '*'

      Tags:
        - Key: Purpose
          Value: BedrockAgentCore
        - Key: ManagedBy
          Value: CloudFormation